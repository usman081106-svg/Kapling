<h2>Formulir Kontak</h2>

<form action="#" method="post">

    <label for="nama">Nama Lengkap:</label>
    <input type="text" id="nama" name="nama"
           required minlength="3" maxlength="60">

    <label for="email">Email:</label>
    <input type="email" id="email" name="email"
           required>

    <label for="hp">Nomor HP:</label>
    <input type="tel" id="hp" name="hp"
           pattern="[0-9]{10,13}"
           title="Masukkan 10 sampai 13 angka"
           required>

    <label for="keperluan">Keperluan:</label>
    <select id="keperluan" name="keperluan" required>
        <option value="">Pilih Keperluan</option>
        <option value="pemesanan">Pemesanan Produk</option>
        <option value="informasi">Informasi Produk</option>
        <option value="kerjasama">Kerja Sama</option>
    </select>

    <label for="pesan">Pesan:</label>
    <textarea id="pesan" name="pesan"
              minlength="10" maxlength="500"
              required></textarea>

    <button type="submit">Kirim Pesan</button>

</form>
